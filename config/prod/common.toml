[common-etcd]
host = "etcd:2379"
basePath = "/gochat_srv"
serverPathLogic = "LogicRpc"
serverPathConnect = "ConnectRpc"
userName = ""
password = ""
connectionTimeout = 5

[common-redis]
redisAddress = "redis:6379"
redisPassword = ""
db = 0

[common-db]
host = "postgres"
port = 5432
user = "gochat"
# Development default only. Real deployments inject DB_PASSWORD from the
# orchestrator secret store, which overrides this value.
password = "gochat_secret"
dbName = "gochat"
sslMode = "disable"
maxIdleConns = 10
maxOpenConns = 100
# Seconds. Bounds how long a pooled connection lives so that rolling database
# restarts and DNS changes are picked up.
connMaxLifetime = 3600

[common-rabbitmq]
url = "amqp://gochat:gochat_secret@rabbitmq:5672/gochat"
prefetchCount = 10

[common-tracing]
enabled = true
endpoint = "jaeger:4318"
samplingRate = 0.1