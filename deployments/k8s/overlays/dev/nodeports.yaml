# The three services a person interacts with, published on fixed NodePorts that
# kind-cluster.yaml maps to the matching host ports. The numbers are not
# arbitrary: the committed frontend bundle has 127.0.0.1:7070 and
# ws://127.0.0.1:7000/ws compiled into it.
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: gochat
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: metrics
      port: 9096
      targetPort: 9096
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gochat
spec:
  type: NodePort
  ports:
    - name: http
      port: 7070
      targetPort: 7070
      nodePort: 30070
    - name: metrics
      port: 9095
      targetPort: 9095
---
apiVersion: v1
kind: Service
metadata:
  name: connect-ws
  namespace: gochat
spec:
  type: NodePort
  ports:
    - name: ws
      port: 7000
      targetPort: 7000
      nodePort: 30000
    - name: metrics
      port: 9092
      targetPort: 9092
