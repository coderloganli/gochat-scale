apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay. Mirrors deployments/docker-compose.dev.yml: debug logging,
# and the ports the developer actually reaches published on the host.
namespace: gochat

resources:
  - ../../base

patches:
  - path: nodeports.yaml
  - path: debug-logging.yaml
    target:
      kind: Deployment
