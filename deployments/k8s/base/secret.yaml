# Development credentials, committed on purpose: they are the same values that
# are already in docker-compose.yml and config/dev/common.toml, and this cluster
# is a local demo. A real deployment injects these from a secret store - the
# application reads DB_PASSWORD from the environment precisely so that it can.
apiVersion: v1
kind: Secret
metadata:
  name: gochat-credentials
  namespace: gochat
type: Opaque
stringData:
  POSTGRES_PASSWORD: gochat_secret
  DB_PASSWORD: gochat_secret
  RABBITMQ_PASSWORD: gochat_secret
