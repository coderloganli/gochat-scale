# api - the REST gateway. Terminates client HTTP and calls logic over RPC.
#
# Autoscaled on gochat_admission_in_flight, below the admission limit, so that
# capacity is added before load shedding starts (docs/adr/0009, docs/adr/0012).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: gochat
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 7070
      targetPort: 7070
    - name: metrics
      port: 9095
      targetPort: 9095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: gochat
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
    spec:
      terminationGracePeriodSeconds: 30
      # Kubernetes has no depends_on. logic and task panic if they cannot reach
      # their dependencies at startup, so without this they crash-loop until the
      # dependency appears - which works, but the backoff reaches five minutes and
      # makes "one command brings it up" a lie. Waiting here costs a few seconds
      # on a cold cluster and nothing on a warm one.
      initContainers:
        - name: wait-for-deps
          image: gochat:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z etcd 2379; do echo "waiting for etcd:2379"; sleep 2; done
              echo "dependencies reachable"
      containers:
        - name: gochat
          image: gochat:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/gochat", "-module", "api"]
          env:
            - name: RUN_MODE
              value: dev
          ports:
            - name: http
              containerPort: 7070
            - name: metrics
              containerPort: 9095
          livenessProbe:
            httpGet:
              path: /health
              port: 9095
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # api does no work of its own: every request becomes a logic RPC, so
          # being able to resolve logic is the whole readiness question.
          readinessProbe:
            httpGet:
              path: /ready
              port: 9095
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
