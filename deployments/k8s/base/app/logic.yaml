# logic - business logic, and the only service that touches the database.
#
# The Service exists for metrics scraping, not for RPC. api, connect and task
# reach logic by resolving pod IPs out of etcd, not through this Service, which
# is what lets task address one specific instance (docs/adr/0002).
apiVersion: v1
kind: Service
metadata:
  name: logic
  namespace: gochat
  labels:
    app: logic
spec:
  selector:
    app: logic
  ports:
    - name: rpc
      port: 6900
      targetPort: 6900
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logic
  namespace: gochat
  labels:
    app: logic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logic
  template:
    metadata:
      labels:
        app: logic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      terminationGracePeriodSeconds: 30
      # Kubernetes has no depends_on. logic and task panic if they cannot reach
      # their dependencies at startup, so without this they crash-loop until the
      # dependency appears - which works, but the backoff reaches five minutes and
      # makes "one command brings it up" a lie. Waiting here costs a few seconds
      # on a cold cluster and nothing on a warm one.
      initContainers:
        - name: wait-for-deps
          image: gochat:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z etcd 2379; do echo "waiting for etcd:2379"; sleep 2; done
              until nc -z redis 6379; do echo "waiting for redis:6379"; sleep 2; done
              until nc -z postgres 5432; do echo "waiting for postgres:5432"; sleep 2; done
              until nc -z rabbitmq 5672; do echo "waiting for rabbitmq:5672"; sleep 2; done
              echo "dependencies reachable"
      containers:
        - name: gochat
          image: gochat:dev
          imagePullPolicy: IfNotPresent
          args: ["/app/gochat", "-module", "logic"]
          env:
            - name: RUN_MODE
              value: dev
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gochat-credentials
                  key: DB_PASSWORD
          ports:
            - name: rpc
              containerPort: 6900
            - name: rpc-2
              containerPort: 6901
            - name: metrics
              containerPort: 9091
          # Liveness asks whether the process is wedged. It is deliberately
          # unconditional - a database outage must not restart every replica.
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness asks whether it can serve: database, Redis, RabbitMQ, and
          # its own registration in etcd. See docs/adr/0011.
          # timeoutSeconds is explicit because the default is 1s while the /ready
          # handler budgets 2s for its checks. With the default, a slow
          # dependency surfaces as a kubelet probe timeout instead of the 503
          # that names which check failed - which throws away the diagnostic the
          # endpoint exists to provide.
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi
